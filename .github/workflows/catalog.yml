name: Katalog für die Bibel-App
# Erzeugt catalog.json neu, sobald sich Übersetzungsdaten ändern (Version je Übersetzung = Hash
# über alle Dateien). Die Bibel-App erkennt daran, dass sie eine Übersetzung neu laden soll.
on:
  push:
    branches: [main]
    paths-ignore: [catalog.json]
  workflow_dispatch:
permissions:
  contents: write
# Mehrere Pushes kurz nacheinander: nur der neueste Lauf zählt
concurrency:
  group: catalog
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_catalog.py
      - run: |
          git config user.name "Daniel"
          git config user.email "dfoerder@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || { git commit -m "Katalog aktualisiert"; git pull --rebase -q origin main; git push; }
